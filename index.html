<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1 id="title">Survey Form</h1>
        <p id="description">Thank you for taking 
        the time to help us improve the platform</p>
    </header>
<!-- ........................ -->
    <form id="survey-form"> 


        <fieldset>
            <label id="name-label" for="name">Name
                <input type="text" id="name" required name="name" placeholder="Enter your name">
            </label>
            <label id="email-label" for="email">Email
                <input type="email" id="email" required name="email" placeholder="Enter your email">
            </label>
            <label id="number-label" for="age">Age (optional)
                <input type="number" id="number" name="number" min="18" max="55" placeholder="Enter your age">
            </label>
            
            <label>Which option best describes your current role?
                <select id="dropdown">
                    <option value="">Select current role</option>
                    <option value="1">Student</option>
                    <option value="2">Full Time Job</option>
                    <option value="3">Full Time Learner</option>
                    <option value="4">Prefer not to say</option>
                    <option value="5">Other</option>
                </select>

            </label>

        </fieldset>
<!-- ------------------------- -->
        <fieldset>
    <legend>Would you recommend freeCodeCamp to a friend?</legend>
       <label for="definitely"> <input type="radio" name="radio-group" value="definitely" class="inline"> Definitely </label> 
       <label for="maybe"> <input type="radio" name="radio-group" value="maybe" class="inline"> Maybe </label>
       <label for="not-sure"> <input type="radio" name="radio-group" value="not-sure" class="inline"> Not sure </label>

</fieldset>
        <fieldset>
            <label> What is your favorite feature of freeCodeCamp?
                <select name="dropdown" id="dropdown">
                    <option value="">Select an option</option>
                    <option value="1">Challenges</option>
                    <option value="2">Projects</option>
                    <option value="3">Community</option>
                    <option value="4">Open Source</option>
                </select>
            </label>
        </fieldset>

        <fieldset>
            <label>What would you like to see improved? (Check all that apply)
                    <label ><input type="checkbox" name="improved" id="improved" value="improved">Improved</label> 
                    <label ><input type="checkbox" name="front-end-Projects" value="front-end-Projects" id="front-end-Projects" class="inline">Front-end Projects</label>
                    <label ><input type="checkbox" name="back-end-Projects" value="back-end-Projects" id="back-end-Projects" class="inline">Back-end Projects</label>
                    <label ><input type="checkbox" name="data-Visualization" value="data-Visualization" id="data-Visualization Visualization" class="inline">Data Visualization</label>
                    <label ><input type="checkbox" name="challenges" value="challenges" id="Challenges" class="inline">Challenges</label>
                    <label ><input type="checkbox" name="open-Source-Community" value="open-Source-Community" id="open-Source-Community" class="inline">Open Source Community</label>
                    <label ><input type="checkbox" name="gitter-help-rooms" value="gitter-help-rooms" id="Gitter-help-rooms" class="inline">Gitter help rooms</label>
                    <label ><input type="checkbox" name="videos" value="videos" id="videos" class="inline">Videos</label>
                    <label ><input type="checkbox" name="city-Meetups" value="city-Meetups" id="city-Meetups" class="inline">City Meetups</label>
                    <label ><input type="checkbox" name="wiki" value="wiki" id="wiki">Wiki</label>
                    <label ><input type="checkbox" name="forum" value="forum" id="forum" class="inline">Forum</label>
                    <label ><input type="checkbox" name="additional-Courses" id="additional-Courses" value="additional-Courses" class="inline">Additional Courses</label>
            </label>


        </fieldset>
        
        <fieldset>
            <label> Any comments or suggestions? 
                <textarea  placeholder="Enter your comment here...">
            
                </textarea>
            </label>
            <button id="submit">Submit</button>
        </fieldset>

        
    
    </form>

    

    
</body>
</html>
